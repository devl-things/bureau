<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Daily Chores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        :root {
            --bg: #f3f4f6;
            --bg-card: #ffffff;
            --accent: #16a34a;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-subtle: #e5e7eb;
            --radius-lg: 18px;
            --shadow-soft: 0 8px 22px rgba(15, 23, 42, 0.12);

            --priority-critical: #9f1239;
            --priority-high: #b45309;
            --priority-medium: #1d4ed8;
            --priority-low: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #e5e7eb 0, #f9fafb 45%, #f3f4f6 100%);
            color: var(--text-main);
            margin: 0;
            overflow-y: auto;
            /* allow normal page scroll (single scroll) */
        }

        .app {
            min-height: 100vh;
            width: 100vw;
            max-width: 100vw;
            background: var(--bg);
            padding: 16px;
        }

        .app-inner {
            min-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 16px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 650;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 0.78rem;
            color: var(--text-muted);
            gap: 8px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .status-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .status-pill {
            border-radius: 999px;
            padding: 3px 6px 3px 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: 1px solid #d1d5db;
        }

        .status-indicator {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: radial-gradient(circle, #22c55e, #16a34a);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25);
        }

        .status-label {
            font-size: 0.7rem;
            color: #166534;
        }

        .status-label.offline {
            color: #b91c1c;
        }

        .status-dot-offline {
            background: radial-gradient(circle, #f97373, #ef4444);
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.25);
        }

        .status-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Round refresh button */
        .refresh-btn {
            border: 1px solid #d1d5db;
            background: #ffffff;
            border-radius: 999px;
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08);
        }

        .refresh-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
        }

        .refresh-btn[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .refresh-icon {
            font-size: 1rem;
            display: inline-block;
            transition: transform 0.25s ease-out;
        }

        .refresh-btn.loading .refresh-icon {
            animation: spin 0.85s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .chores-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            padding: 12px 10px 10px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .chores-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chores-title {
            font-size: 0.94rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chores-count {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .progress-bar {
            position: relative;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
            border: 1px solid #d1d5db;
            margin-bottom: 2px;
        }

        .progress-fill {
            position: absolute;
            inset: 0;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #22c55e, #4ade80);
            transition: width 0.25s ease-out;
        }

        .chores-scroll {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin-top: 4px;
        }

        .chores-list {
            list-style: none;
            margin: 0;
            padding: 2px 1px 4px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .chore {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 9px 9px 10px;
            border-radius: 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05);
            transform: translateY(0);
            transition: transform 0.18s ease-out, box-shadow 0.18s ease-out,
                border-color 0.18s ease-out, background 0.18s ease-out,
                opacity 0.18s ease-out;
            cursor: pointer;
        }

        .chore:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
            border-color: rgba(59, 130, 246, 0.5);
            background: #ffffff;
        }

        .chore.completed {
            border-color: rgba(22, 163, 74, 0.75);
            background: #ecfdf5;
            opacity: 0.95;
        }

        .chore-left {
            display: flex;
            align-items: center;
            gap: 7px;
            flex: 1;
        }

        .chore-texts {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chore-title {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0;
        }

        .chore-desc {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .chore-meta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
        }

        .priority-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #e5e7eb;
            font-weight: 500;
            cursor: default;
        }

        .priority-arrow {
            font-size: 0.8rem;
        }

        .priority-label-short {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 999px;
            background: #f9fafb;
        }

        .priority-critical {
            border-color: rgba(159, 18, 57, 0.4);
            color: var(--priority-critical);
        }

        .priority-critical .priority-label-short {
            background: #fdf2f8;
            color: var(--priority-critical);
        }

        .priority-high {
            border-color: rgba(180, 83, 9, 0.4);
            color: var(--priority-high);
        }

        .priority-high .priority-label-short {
            background: #fffbeb;
            color: var(--priority-high);
        }

        .priority-medium {
            border-color: rgba(37, 99, 235, 0.35);
            color: var(--priority-medium);
        }

        .priority-medium .priority-label-short {
            background: #eff6ff;
            color: var(--priority-medium);
        }

        .priority-low {
            border-color: rgba(21, 128, 61, 0.35);
            color: var(--priority-low);
        }

        .priority-low .priority-label-short {
            background: #ecfdf5;
            color: var(--priority-low);
        }

        .type-pill {
            padding: 2px 6px;
            border-radius: 999px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #4b5563;
        }

        .type-pill.extra {
            background: #fff7ed;
            border-color: #fed7aa;
            color: #9a3412;
        }

        .checkbox-wrap {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 1.6px solid #d1d5db;
            background: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: border-color 0.16s ease-out, background 0.16s ease-out, box-shadow 0.16s ease-out;
        }

        input[type="checkbox"]::after {
            content: "✓";
            font-size: 0.9rem;
            color: white;
            transform: scale(0);
            transition: transform 0.14s ease-out;
        }

        input[type="checkbox"]:checked {
            border-color: transparent;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.35);
        }

        input[type="checkbox"]:checked::after {
            transform: scale(1);
        }

        .submit-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            position: sticky;
            bottom: 0;
            padding-top: 6px;
            padding-bottom: 4px;
            background: linear-gradient(to top, var(--bg-card), rgba(255, 255, 255, 0.85));
        }

        .submit-btn {
            border-radius: 999px;
            padding: 8px 16px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #f9fafb;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.35);
        }

        .submit-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%) translateY(120%);
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            background: #111827;
            color: #f9fafb;
            border: 1px solid rgba(31, 41, 55, 0.65);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 40;
            opacity: 0;
            transition: transform 0.22s ease-out, opacity 0.22s ease-out;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon {
            font-size: 1rem;
        }

        .toast-text {
            white-space: nowrap;
        }

        .toast-error {
            background: #7f1d1d;
            border-color: #fecaca;
            color: #fee2e2;
        }

        .empty-state {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            padding: 12px 6px;
        }

        .badge-offline {
            font-size: 0.7rem;
            color: #b91c1c;
        }

        .loading-row {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 2px 2px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #9ca3af;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.4;
            }
        }

        /* Modal popup for summary (duration + note) */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 30;
        }

        .modal-backdrop.visible {
            display: flex;
        }

        .modal-panel {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px 16px 14px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .modal-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .modal-field label {
            font-size: 0.8rem;
            color: var(--text-main);
            display: block;
            margin-bottom: 3px;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 6px 8px;
            font-size: 0.85rem;
            font-family: inherit;
        }

        .modal-field input:focus,
        .modal-field textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
        }

        .modal-field input[type="number"] {
            -moz-appearance: textfield;
        }

        .modal-field input[type="number"]::-webkit-outer-spin-button,
        .modal-field input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .modal-field textarea {
            resize: vertical;
            min-height: 60px;
            max-height: 160px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            font-weight: 500;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #111827;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #f9fafb;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.35);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
        }

        .btn[disabled] {
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (min-width: 600px) {
            .app {
                padding: 24px;
            }

            .app-inner {
                min-height: calc(100vh - 48px);
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="app-inner">
            <header>
                <div class="title-block">
                    <div class="app-title">Today’s Chores</div>
                    <div id="today-date" class="date"></div>
                </div>
            </header>

            <div class="status-row">
                <div class="status-left">
                    <div class="status-text">
                        <span id="status-message">Checking connection…</span>
                    </div>
                </div>
                <div class="status-actions">
                    <button class="refresh-btn" id="refresh-btn" type="button" title="Refresh" aria-label="Refresh">
                        <span class="refresh-icon">⟳</span>
                    </button>
                    <div class="status-pill" id="status-pill">
                        <span class="status-indicator"></span>
                        <span class="status-label" id="status-label">Online</span>
                    </div>
                </div>
            </div>

            <form id="chores-form" style="display:flex;flex-direction:column;flex:1;min-height:0;">
                <div class="chores-card">
                    <div class="chores-header-row">
                        <div class="chores-title">
                            <span>Checklist</span>
                            <span class="badge-offline" id="offline-badge" style="display:none;">(offline)</span>
                        </div>
                        <div class="chores-count" id="chores-count">0 done · 0 total</div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>

                    <div class="chores-scroll">
                        <div class="loading-row" id="loading-row">
                            <span class="loading-dot"></span>
                            <span>Loading your tasks…</span>
                        </div>

                        <ul id="chores-list" class="chores-list"></ul>

                        <div class="empty-state" id="empty-state" style="display:none;">
                            No chores found for today.
                        </div>
                    </div>

                    <div class="submit-row">
                        <button type="button" id="submit-btn" class="submit-btn">
                            Submit
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal popup for duration + note -->
    <div class="modal-backdrop" id="summary-modal">
        <div class="modal-panel">
            <div class="modal-title">Finish today’s chores</div>
            <div class="modal-subtitle">
                Add how long it took and any short note before submitting.
            </div>
            <div class="modal-fields">
                <div class="modal-field">
                    <label for="modal-hours">Hours</label>
                    <input type="number" id="modal-hours" min="0" placeholder="e.g. 1" />
                </div>
                <div class="modal-field">
                    <label for="modal-minutes">Minutes</label>
                    <input type="number" id="modal-minutes" min="0" max="59" placeholder="e.g. 35" />
                </div>
                <div class="modal-field">
                    <label for="modal-note">Note</label>
                    <textarea id="modal-note" placeholder="Optional note about today’s chores..."></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="modal-cancel-btn">
                    Cancel
                </button>
                <button type="button" class="btn btn-primary" id="modal-confirm-btn">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span class="toast-icon" id="toast-icon">✓</span>
        <span class="toast-text" id="toast-text">Saved</span>
    </div>

    <script src="/js/app-config.js"></script>
    <script>
        // Priority numbers: 1=critical, 2=high, 3=medium, 4=low
        const PRIORITY = {
            CRITICAL: 1,
            HIGH: 2,
            MEDIUM: 3,
            LOW: 4
        };

        let todayIso = null; // YYYY-MM-DD

        document.addEventListener("DOMContentLoaded",async () => {
            const apiConfig = await loadApiConfig();
                
            renderTodayDate();

            const refreshBtn = document.getElementById("refresh-btn");
            refreshBtn.addEventListener("click", () => {
                checkApiHealthAndLoad(apiConfig);
            });

            const submitBtn = document.getElementById("submit-btn");
            submitBtn.addEventListener("click", openSummaryModal);

            const modalCancelBtn = document.getElementById("modal-cancel-btn");
            modalCancelBtn.addEventListener("click", closeSummaryModal);

            const modalConfirmBtn = document.getElementById("modal-confirm-btn");
            modalConfirmBtn.addEventListener("click", () => {
                handleConfirmSubmit(apiConfig);
            });

            const modalBackdrop = document.getElementById("summary-modal");
            modalBackdrop.addEventListener("click", (e) => {
                if (e.target === modalBackdrop) {
                    closeSummaryModal();
                }
            });

            checkApiHealthAndLoad(apiConfig);
        });

        function renderTodayDate() {
            const dateEl = document.getElementById("today-date");
            const now = new Date();

            dateEl.textContent = now.toLocaleDateString(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

            todayIso = now.toISOString().slice(0, 10);;
        }
        /**
         * @param {ApiConfig} apiConfig
         */
        async function checkApiHealthAndLoad(apiConfig) {
            setLoading(true);
            try {
                setStatus("Checking connection…", "online");
                const healthy = await checkHealth(apiConfig);
                if (!healthy) {
                    setStatus("API unreachable", "offline");
                    document.getElementById("offline-badge").style.display = "inline";
                    clearChoresList();
                    showToast("Service currently unavailable.", true);
                    return;
                }

                setStatus("Loading chores…", "online");
                document.getElementById("offline-badge").style.display = "none";
                await loadChores(apiConfig);
                setStatus("Chores loaded", "online");
            } catch (err) {
                console.error("Health check / load failed:", err);
                setStatus("API unreachable", "offline");
                document.getElementById("offline-badge").style.display = "inline";
                clearChoresList();
                showToast("Service currently unavailable.", true);
            } finally {
                setLoading(false);
            }
        }
        /**
         * @param {ApiConfig} apiConfig
         */
        async function checkHealth(apiConfig) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const resp = await fetch(apiConfig.health, { signal: controller.signal });
                clearTimeout(timeoutId);
                return resp.ok;
            } catch (error) {
                console.error("Failed to check health:", error);
                clearTimeout(timeoutId);
                return false;
            }
        }
        /**
         * @param {ApiConfig} apiConfig
         */
        async function loadChores(apiConfig) {
            try {
                setLoading(true);
                const chores = await fetchChoresFromApi(apiConfig);
                renderChores(chores);
            } catch (error) {
                console.error("Failed to load chores:", error);
                showToast("Couldn’t load chores.", true);
                setStatus("Error loading chores", "online");
                clearChoresList();
            } finally {
                setLoading(false);
            }
        }
        /**
         * @param {ApiConfig} apiConfig
         */
        async function fetchChoresFromApi(apiConfig) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            const url = `${apiConfig.prioritizedChores}?date=${encodeURIComponent(todayIso)}`;
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error("API response not OK: " + response.status);
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                throw new TypeError("Unexpected API format (expected array)");
            }

            return data.map((item, index) => {
                // The API now returns explicit `criticality` and `priority` fields.
                // We use `criticality` to determine critical/high/medium/low and
                // `priority` as a secondary numeric sort key. Do not infer
                // criticality from the priority number.
                const criticalityNum = Number(item.criticality) || PRIORITY.MEDIUM;
                const priorityNum = Number(item.priority) || 0;

                return {
                    id: item.id ?? String(index),
                    title: item.title ?? "Untitled chore",
                    description: item.description ?? "",
                    completed: !!item.completed,
                    criticalityNumber: criticalityNum,
                    criticalityName: priorityNameFromNumber(criticalityNum),
                    priority: priorityNum,
                    type: normalizeType(item.type)
                };
            });
        }

        // Note: criticality is now provided explicitly by the API, so we no
        // longer attempt to infer it from the numeric priority value.

        function priorityNameFromNumber(num) {
            switch (num) {
                case PRIORITY.CRITICAL: return "critical";
                case PRIORITY.HIGH: return "high";
                case PRIORITY.LOW: return "low";
                default: return "medium";
            }
        }

        function priorityLabelShort(name) {
            switch (name) {
                case "critical": return "C";
                case "high": return "H";
                case "medium": return "M";
                case "low": return "L";
                default: return "?";
            }
        }

        function priorityTooltip(name) {
            switch (name) {
                case "critical": return "Critical priority";
                case "high": return "High priority";
                case "medium": return "Medium priority";
                case "low": return "Low priority";
                default: return "Priority";
            }
        }

        function normalizeType(value) {
            if (!value) return "Maintenance";
            const v = String(value).toLowerCase();
            if (v === "extra") return "Extra";
            return "Maintenance";
        }

        function renderChores(chores) {
            const listEl = document.getElementById("chores-list");
            const emptyState = document.getElementById("empty-state");
            listEl.innerHTML = "";

            if (!chores || chores.length === 0) {
                emptyState.style.display = "block";
                updateProgress(0, 0);
                updateCount(0, 0);
                return;
            }

            emptyState.style.display = "none";

            chores.forEach((chore, index) => {
                const li = document.createElement("li");
                li.className = "chore";
                li.dataset.choreId = chore.id;
                li.dataset.criticalityNumber = String(chore.criticalityNumber);
                li.dataset.priority = String(chore.priority);
                li.dataset.originalIndex = String(index);


                const leftDiv = document.createElement("div");
                leftDiv.className = "chore-left";

                const textDiv = document.createElement("div");
                textDiv.className = "chore-texts";

                const titleEl = document.createElement("div");
                titleEl.className = "chore-title";
                titleEl.textContent = chore.title;

                const descEl = document.createElement("div");
                descEl.className = "chore-desc";
                descEl.textContent = chore.description || "";

                textDiv.appendChild(titleEl);
                if (chore.description) {
                    textDiv.appendChild(descEl);
                }

                const metaEl = document.createElement("div");
                metaEl.className = "chore-meta";

                const priorityPill = document.createElement("div");
                // Use the chore's criticality for the pill styling and label
                const criticalityName = chore.criticalityName || priorityNameFromNumber(PRIORITY.MEDIUM);
                priorityPill.className = `priority-pill priority-${criticalityName}`;
                priorityPill.title = priorityTooltip(criticalityName);

                const arrowSpan = document.createElement("span");
                arrowSpan.className = "priority-arrow";
                arrowSpan.textContent = "▲";

                const shortLabel = document.createElement("span");
                shortLabel.className = "priority-label-short";
                shortLabel.textContent = priorityLabelShort(criticalityName);

                priorityPill.appendChild(arrowSpan);
                priorityPill.appendChild(shortLabel);

                const typePill = document.createElement("div");
                typePill.className = "type-pill" + (chore.type === "Extra" ? " extra" : "");
                typePill.textContent = chore.type;

                metaEl.appendChild(priorityPill);
                metaEl.appendChild(typePill);

                textDiv.appendChild(metaEl);

                leftDiv.appendChild(textDiv);

                const checkboxWrap = document.createElement("div");
                checkboxWrap.className = "checkbox-wrap";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.name = "chore";
                checkbox.value = chore.id;
                checkbox.checked = !!chore.completed;

                checkboxWrap.appendChild(checkbox);

                li.appendChild(leftDiv);
                li.appendChild(checkboxWrap);

                if (checkbox.checked) {
                    li.classList.add("completed");
                }

                li.addEventListener("click", (event) => {
                    if (event.target === checkbox) return;
                    checkbox.checked = !checkbox.checked;
                    handleCheckboxChange(checkbox, li);
                });

                checkbox.addEventListener("change", () => handleCheckboxChange(checkbox, li));

                listEl.appendChild(li);
            });

            reorderList();
            refreshProgressAndCount();
        }

        function handleCheckboxChange(checkbox, choreElement) {
            const completed = checkbox.checked;

            if (completed) {
                choreElement.classList.add("completed");
            } else {
                choreElement.classList.remove("completed");
            }

            refreshProgressAndCount();
            reorderList();
            // No per-toggle API call anymore
        }

        // Sort: unchecked first, completed last, then by criticality (1=critical → 4=low),
        // then by numeric priority (lower numbers first), then by original index
        function reorderList() {
            const listEl = document.getElementById("chores-list");
            const items = Array.from(listEl.children);

            items.sort((a, b) => {
                const aChecked = a.querySelector('input[name="chore"]').checked;
                const bChecked = b.querySelector('input[name="chore"]').checked;

                // Group by completion status: unchecked first, completed last
                if (aChecked !== bChecked) {
                    return aChecked ? 1 : -1; // unchecked first
                }

                // Within the same completion group, sort by criticality first
                const aCriticality = Number(a.dataset.criticalityNumber || PRIORITY.MEDIUM);
                const bCriticality = Number(b.dataset.criticalityNumber || PRIORITY.MEDIUM);
                if (aCriticality !== bCriticality) {
                    return aCriticality - bCriticality; // lower number = higher criticality (1=critical)
                }

                // If same criticality, sort by the returned numeric priority
                const aPriority = Number(a.dataset.priority || 0);
                const bPriority = Number(b.dataset.priority || 0);
                if (aPriority !== bPriority) {
                    return aPriority - bPriority; // lower number = higher priority
                }

                // If same priority, maintain original order
                const aIndex = Number(a.dataset.originalIndex || 0);
                const bIndex = Number(b.dataset.originalIndex || 0);
                return aIndex - bIndex;
            });

            items.forEach((item) => listEl.appendChild(item));
        }

        function refreshProgressAndCount() {
            const checkboxes = Array.from(document.querySelectorAll('input[name="chore"]'));
            const total = checkboxes.length;
            const done = checkboxes.filter((cb) => cb.checked).length;
            updateProgress(done, total);
            updateCount(done, total);
        }

        function updateProgress(done, total) {
            const fillEl = document.getElementById("progress-fill");
            const percent = total === 0 ? 0 : Math.round((done / total) * 100);
            fillEl.style.width = percent + "%";
        }

        function updateCount(done, total) {
            const countEl = document.getElementById("chores-count");
            countEl.textContent = `${done} done · ${total} total`;
        }

        function clearChoresList() {
            const listEl = document.getElementById("chores-list");
            const emptyState = document.getElementById("empty-state");
            listEl.innerHTML = "";
            emptyState.style.display = "block";
            updateProgress(0, 0);
            updateCount(0, 0);
        }

        function setStatus(message, mode) {
            const statusMessageEl = document.getElementById("status-message");
            const statusLabelEl = document.getElementById("status-label");
            const statusPill = document.getElementById("status-pill");
            const indicator = statusPill.querySelector(".status-indicator");

            statusMessageEl.textContent = message;

            if (mode === "offline") {
                statusLabelEl.textContent = "Offline";
                statusLabelEl.classList.add("offline");
                indicator.classList.add("status-dot-offline");
            } else {
                statusLabelEl.textContent = "Online";
                statusLabelEl.classList.remove("offline");
                indicator.classList.remove("status-dot-offline");
            }
        }

        function setLoading(isLoading) {
            const loadingRow = document.getElementById("loading-row");
            const refreshBtn = document.getElementById("refresh-btn");
            loadingRow.style.display = isLoading ? "flex" : "none";
            refreshBtn.disabled = isLoading;
            refreshBtn.classList.toggle("loading", isLoading);
        }

        function openSummaryModal() {
            const modal = document.getElementById("summary-modal");
            const hoursInput = document.getElementById("modal-hours");
            const minutesInput = document.getElementById("modal-minutes");
            const noteInput = document.getElementById("modal-note");

            if (getCompletedChoreIds().length === 0) {
                showToast("No completed chores to submit.", true);
                return;
            }

            modal.classList.add("visible");
            hoursInput.value = "";
            minutesInput.value = "";
            noteInput.value = "";
            hoursInput.focus();
        }

        function closeSummaryModal() {
            const modal = document.getElementById("summary-modal");
            const confirmBtn = document.getElementById("modal-confirm-btn");
            confirmBtn.disabled = false;
            modal.classList.remove("visible");
        }

        function getCompletedChoreIds() {
            const checkboxes = Array.from(document.querySelectorAll('input[name="chore"]'));
            return checkboxes
                .filter((cb) => cb.checked)
                .map((cb) => cb.value);
        }

        /**
         * @param {ApiConfig} apiConfig
         */
        async function handleConfirmSubmit(apiConfig) {
            const confirmBtn = document.getElementById("modal-confirm-btn");
            const hoursInput = document.getElementById("modal-hours");
            const minutesInput = document.getElementById("modal-minutes");
            const noteInput = document.getElementById("modal-note");

            const completedIds = getCompletedChoreIds();
            if (completedIds.length === 0) {
                showToast("No completed chores to submit.", true);
                return;
            }
            const hoursRaw = (hoursInput.value || "").trim();
            const minutesRaw = (minutesInput.value || "").trim();
            const hours = hoursRaw === "" ? 0 : Math.max(0, Number(hoursRaw));
            const minutes = minutesRaw === "" ? 0 : Math.max(0, Number(minutesRaw));

            // Must have a positive total duration > 0
            const totalMinutes = (hours * 60) + minutes;
            if (totalMinutes <= 0) {
                showToast("Please enter a duration greater than 0.", true);
                return;
            }
            const note = noteInput.value.trim();

            confirmBtn.disabled = true;

            try {
                // Format date as yyyy-MM-dd'T'HH:mm:ss.fffK
                const now = new Date();
                const isoWithOffset = now.toISOString();
                // Format duration as hh:mm (pad hours to at least 1+ digits and minutes 2 digits)
                const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
                const mm = String(totalMinutes % 60).padStart(2, '0');
                const durationFormatted = `${hh}:${mm}`;

                const payload = {
                    date: isoWithOffset,
                    duration: durationFormatted,
                    note: note,
                    completedChoreIds: completedIds
                };

                const response = await fetch(apiConfig.housekeepingSubmit, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(`Submit failed with status ${response.status}: ${JSON.stringify(error)}`);
                }

                showToast("Chores submitted ✔");
                closeSummaryModal();
                checkApiHealthAndLoad(apiConfig);
            } catch (error) {
                console.error("Failed to submit chores summary:", error);
                showToast("Couldn’t submit chores.", true);
                confirmBtn.disabled = false;
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            const text = document.getElementById("toast-text");
            const icon = document.getElementById("toast-icon");

            text.textContent = message;
            toast.classList.toggle("toast-error", isError);
            icon.textContent = isError ? "⚠️" : "✨";

            toast.classList.add("visible");

            clearTimeout(showToast._timeoutId);
            showToast._timeoutId = setTimeout(() => {
                toast.classList.remove("visible");
            }, 2600);
        }
    </script>
</body>
