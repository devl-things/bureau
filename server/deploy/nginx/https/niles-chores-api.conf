# Chores - subdomain routing
# Host: chores.devl.lan
# Web:  /
# API:  /api/

server {
    listen 80;
    server_name ${DEPLOY__NGINX__CHORES__API__SERVER_NAME};

    include /etc/nginx/snippets/lan_only.conf;

    return 301 https://${DEPLOY__NGINX__CHORES__API__SERVER_NAME}$request_uri;
}

server {
    listen 443 ssl;
    server_name ${DEPLOY__NGINX__CHORES__API__SERVER_NAME};

    # LAN-only access
    include /etc/nginx/snippets/lan_only.conf;

    ssl_certificate     /etc/letsencrypt/live/${DEPLOY__NGINX__CHORES__API__SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DEPLOY__NGINX__CHORES__API__SERVER_NAME}/privkey.pem;

    location / {
        proxy_pass ${DEPLOY__NGINX__CHORES__API_UPSTREAM};
        include /etc/nginx/snippets/proxy_common.conf;
    }
}