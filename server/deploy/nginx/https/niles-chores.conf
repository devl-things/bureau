# Chores - subdomain routing
# Host: chores.devl.lan
# Web:  /
# API:  /api/

server {
    listen 80;
    server_name ${DEPLOY__NGINX__CHORES__SERVER_NAME};

    # LAN-only access
    include /etc/nginx/snippets/lan_only.conf;

    # Docker services on nuc-network
    set \$chores_web ${DEPLOY__NGINX__CHORES__WEB_UPSTREAM};
    set \$chores_api ${DEPLOY__NGINX__CHORES__API_UPSTREAM};

    location ^~ /api/ {
        proxy_pass \$chores_api;
        include /etc/nginx/snippets/proxy_common.conf;
    }

    location / {
        proxy_pass \$chores_web;
        include /etc/nginx/snippets/proxy_common.conf;
    }
}