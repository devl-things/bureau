<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chores Admin</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111c36;
            --panel-light: #152344;
            --border: #243459;
            --text: #f8fafc;
            --muted: #93a8d4;
            --accent: #38bdf8;
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 4px;
        }

        .badge.subtle {
            background: rgba(148, 163, 184, 0.16);
            border-color: rgba(148, 163, 184, 0.25);
            color: var(--muted);
        }

        .muted-label {
            color: var(--muted);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 45%), var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 600;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.96rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .controls input[type="search"] {
            flex: 1;
            min-width: 220px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-light);
            color: var(--text);
            font-size: 0.94rem;
            outline: none;
        }

        .controls input::placeholder {
            color: var(--muted);
        }

        .controls button {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #041424;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .controls button:hover {
            transform: translateY(-1px);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 0 8px;
            box-shadow: 0 25px 60px rgba(2, 6, 23, 0.55);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            padding: 0 20px 12px;
            font-size: 0.82rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        tbody tr {
            border-top: 1px solid var(--border);
        }

        tbody td {
            padding: 16px 20px;
            font-size: 0.95rem;
        }

        tbody tr:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            background: rgba(148, 163, 184, 0.12);
            color: var(--text);
        }

        .btn:hover {
            border-color: var(--accent);
        }

        .btn-danger {
            color: var(--danger);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            background: rgba(56, 189, 248, 0.16);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: var(--accent);
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        .modal-backdrop.visible {
            display: flex;
        }

        .modal {
            width: min(420px, 100%);
            background: #0b1226;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
        }

        .modal header {
            margin-bottom: 16px;
        }

        .modal header h2 {
            margin: 0 0 6px;
            font-size: 1.1rem;
        }

        .modal header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .modal form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0a1121;
            color: var(--text);
            font-size: 0.94rem;
        }

        .modal textarea {
            min-height: 110px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            background: #0b1226;
            color: var(--text);
            border: 1px solid var(--border);
            display: none;
            min-width: 220px;
            box-shadow: 0 20px 45px rgba(2, 6, 23, 0.4);
        }

        .toast.visible {
            display: block;
        }

        .breadcrumbs a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .actions {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <header>
            <div class="title">Chores admin</div>
            <div class="subtitle">Search, review and manage chores from a single table.</div>
            <div class="breadcrumbs">
                <a href="/bureau/server/internal/admin/housekeeping">Housekeeping</a>
            </div>
            <div class="controls">
                <input id="search-input" type="search" placeholder="Search chores by id or title…" autocomplete="off" />
                <button id="create-button" type="button">Create chore</button>
            </div>
        </header>

        <section class="panel">
            <table>
                <thead>
                    <tr>
                        <th style="width:120px;">Chore ID</th>
                        <th>Title</th>
                        <th style="width:240px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="chores-table-body">
                    <tr>
                        <td colspan="3" class="empty">Loading chores…</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
        <div class="modal" id="modal">
            <!-- content injected dynamically -->
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = "/bureau/server/public/api/chores";
        const FAKE_ENDPOINTS = {
            list: `${API_BASE}/index.json`,
            create: `${API_BASE}/create.json`,
            update: `${API_BASE}/update.json`,
            delete: `${API_BASE}/delete.json`,
            important: `${API_BASE}/important.json`
        };
        const state = {
            chores: [],
            filtered: [],
            meta: null,
            activeModal: null,
            activeChore: null,
            search: ""
        };

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("search-input").addEventListener("input", handleSearch);
            document.getElementById("create-button").addEventListener("click", () => openFormModal("create"));
            fetchChores();
        });

        async function fetchChores() {
            setTableMessage("Loading chores…");
            try {
                const response = await fetch(`${FAKE_ENDPOINTS.list}?t=${Date.now()}`);
                if (!response.ok) throw new Error("Failed to load chores");
                const payload = await response.json();
                state.meta = payload?.meta ?? null;
                state.chores = Array.isArray(payload?.data)
                    ? payload.data
                    : Array.isArray(payload)
                        ? payload
                        : [];
            } catch (err) {
                console.error(err);
                state.meta = null;
                state.chores = sampleChores();
                showToast("Using fallback data because API failed");
            }
            applyFilter();
        }

        function handleSearch(event) {
            state.search = event.target.value.trim().toLowerCase();
            applyFilter();
        }

        function applyFilter() {
            if (!state.chores.length) {
                setTableMessage("No chores found.");
                return;
            }

            state.filtered = state.chores.filter((chore) => {
                if (!state.search) return true;
                const needle = state.search;
                const haystack = `${chore.id ?? ""} ${(chore.title ?? "")} ${(chore.type ?? "")}`.toLowerCase();
                return haystack.includes(needle);
            });

            if (!state.filtered.length) {
                setTableMessage("No chores match that search.");
                return;
            }

            renderTable(state.filtered);
        }

        function renderTable(chores) {
            const tbody = document.getElementById("chores-table-body");
            tbody.innerHTML = "";

            chores.forEach((chore) => {
                const row = document.createElement("tr");

                const idCell = document.createElement("td");
                idCell.textContent = chore.id ?? "—";

                const titleCell = document.createElement("td");
                const type = chore.type ? `<span class="badge">${sanitize(chore.type)}</span>` : "";
                const repeatLabel =
                    chore.repeatEveryWeeks || chore.weeklyInterval
                        ? `<small class="muted-label">Every ${sanitize(
                              (chore.repeatEveryWeeks ?? chore.weeklyInterval).toString()
                          )} wk(s)</small>`
                        : "";
                const descriptionBadge = chore.description
                    ? `<small class="badge subtle">${sanitize(chore.description)}</small>`
                    : "";

                titleCell.innerHTML = `<div>${sanitize(chore.title ?? "Untitled")}</div>
                    <div class="meta-line">
                        ${type}
                        ${repeatLabel}
                    </div>
                    ${descriptionBadge}`;

                const actionsCell = document.createElement("td");
                actionsCell.classList.add("actions");
                actionsCell.appendChild(createActionButton("Edit", () => openFormModal("edit", chore)));
                actionsCell.appendChild(createActionButton("Important", () => openImportantModal(chore)));
                actionsCell.appendChild(createActionButton("Delete", () => openDeleteModal(chore), true));

                row.appendChild(idCell);
                row.appendChild(titleCell);
                row.appendChild(actionsCell);
                tbody.appendChild(row);
            });
        }

        function createActionButton(label, handler, isDanger = false) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = label;
            btn.className = `btn${isDanger ? " btn-danger" : ""}`;
            btn.addEventListener("click", handler);
            return btn;
        }

        function setTableMessage(message) {
            const tbody = document.getElementById("chores-table-body");
            tbody.innerHTML = `<tr><td colspan="3" class="empty">${message}</td></tr>`;
        }

        function openFormModal(mode, chore = null) {
            state.activeModal = mode;
            state.activeChore = chore;
            const isEdit = mode === "edit";
            const modal = document.getElementById("modal");
            modal.innerHTML = `
                <header>
                    <h2>${isEdit ? "Edit chore" : "Create chore"}</h2>
                    <p>${isEdit ? "Update the selected chore." : "Add a brand new chore."}</p>
                </header>
                <form id="chore-form">
                    <label>
                        Title
                        <input name="title" required value="${sanitize(chore?.title) || ""}" />
                    </label>
                    <label>
                        Description
                        <textarea name="description">${sanitize(chore?.description) || ""}</textarea>
                    </label>
                    <label>
                        Type
                        <input name="type" placeholder="e.g. Cleaning, Errand" value="${sanitize(chore?.type) || ""}" />
                    </label>
                    <label>
                        Repeat every (weeks)
                        <input name="repeatEveryWeeks" type="number" min="1" step="1" placeholder="1" value="${sanitize(chore?.repeatEveryWeeks?.toString?.() ?? chore?.weeklyInterval?.toString?.() ?? "")}" />
                    </label>
                    <div class="modal-actions">
                        <button type="button" class="btn ghost" id="cancel-modal">Cancel</button>
                        <button type="submit" class="btn">${isEdit ? "Save changes" : "Create"}</button>
                    </div>
                </form>
            `;
            document.getElementById("modal-backdrop").classList.add("visible");
            document.getElementById("cancel-modal").addEventListener("click", closeModal);
            document.getElementById("chore-form").addEventListener("submit", handleFormSubmit);
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const payload = {
                title: formData.get("title"),
                description: formData.get("description"),
                type: formData.get("type") || null,
                repeatEveryWeeks: numberOrNull(formData.get("repeatEveryWeeks"))
            };
            try {
                const isEdit = state.activeModal === "edit";
                const endpoint = isEdit ? FAKE_ENDPOINTS.update : FAKE_ENDPOINTS.create;
                const response = await fetch(`${endpoint}?t=${Date.now()}`);
                if (!response.ok) throw new Error("Request failed");
                const result = await response.json().catch(() => ({}));
                if (isEdit) {
                    state.chores = state.chores.map((chore) =>
                        chore.id === state.activeChore.id ? { ...chore, ...payload } : chore
                    );
                } else {
                    const newChore = result?.chore
                        ? normalizeNewChore(result.chore, payload)
                        : { id: generateChoreId(), ...payload };
                    state.chores = [newChore, ...state.chores];
                }
                applyFilter();
                showToast(isEdit ? "Chore updated" : "Chore created", true);
                closeModal();
            } catch (err) {
                console.error(err);
                showToast("Could not save chore");
            }
        }

        function openDeleteModal(chore) {
            state.activeModal = "delete";
            state.activeChore = chore;
            const modal = document.getElementById("modal");
            modal.innerHTML = `
                <header>
                    <h2>Delete chore</h2>
                    <p>Are you sure you want to delete "${sanitize(chore?.title)}"?</p>
                </header>
                <div class="modal-actions">
                    <button type="button" class="btn ghost" id="cancel-modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
                </div>
            `;
            document.getElementById("modal-backdrop").classList.add("visible");
            document.getElementById("cancel-modal").addEventListener("click", closeModal);
            document.getElementById("confirm-delete").addEventListener("click", handleDelete);
        }

        async function handleDelete() {
            try {
                const response = await fetch(`${FAKE_ENDPOINTS.delete}?t=${Date.now()}`);
                if (!response.ok) throw new Error("Delete failed");
                state.chores = state.chores.filter((chore) => chore.id !== state.activeChore.id);
                applyFilter();
                showToast("Chore deleted", true);
                closeModal();
            } catch (err) {
                console.error(err);
                showToast("Could not delete chore");
            }
        }

        function openImportantModal(chore) {
            state.activeModal = "important";
            state.activeChore = chore;
            const modal = document.getElementById("modal");
            modal.innerHTML = `
                <header>
                    <h2>Mark important</h2>
                    <p>Provide context for why "${sanitize(chore?.title)}" matters.</p>
                </header>
                <form id="important-form">
                    <label>
                        Reminder date
                        <input type="date" name="date" required />
                    </label>
                    <label>
                        Notes
                        <textarea name="description" required placeholder="Describe why this is important"></textarea>
                    </label>
                    <div class="modal-actions">
                        <button type="button" class="btn ghost" id="cancel-modal">Cancel</button>
                        <button type="submit" class="btn">Save</button>
                    </div>
                </form>
            `;
            document.getElementById("modal-backdrop").classList.add("visible");
            document.getElementById("cancel-modal").addEventListener("click", closeModal);
            document.getElementById("important-form").addEventListener("submit", handleImportantSubmit);
        }

        async function handleImportantSubmit(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const payload = {
                date: formData.get("date"),
                description: formData.get("description")
            };
            try {
                const response = await fetch(`${FAKE_ENDPOINTS.important}?t=${Date.now()}`);
                if (!response.ok) throw new Error("Important flag failed");
                const result = await response.json().catch(() => ({}));
                state.chores = state.chores.map((chore) =>
                    chore.id === state.activeChore.id
                        ? {
                              ...chore,
                              important: true,
                              reminder: result?.reminder ?? payload
                          }
                        : chore
                );
                applyFilter();
                showToast("Chore marked important", true);
                closeModal();
            } catch (err) {
                console.error(err);
                showToast("Could not mark chore important");
            }
        }

        function closeModal() {
            document.getElementById("modal-backdrop").classList.remove("visible");
            state.activeModal = null;
            state.activeChore = null;
        }

        function sanitize(str = "") {
            return str.replace(/[&<>"']/g, (char) =>
                ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char] || char)
            );
        }

        function showToast(message, positive = false) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.borderColor = positive ? "rgba(52, 211, 153, 0.4)" : "rgba(248, 113, 113, 0.4)";
            toast.style.color = positive ? varSuccess() : varDanger();
            toast.classList.add("visible");
            clearTimeout(showToast._timeout);
            showToast._timeout = setTimeout(() => toast.classList.remove("visible"), 2600);
        }

        function varSuccess() {
            return getComputedStyle(document.documentElement).getPropertyValue("--success").trim();
        }

        function varDanger() {
            return getComputedStyle(document.documentElement).getPropertyValue("--danger").trim();
        }

        function sampleChores() {
            return [
                { id: "C-101", title: "Kitchen deep clean", description: "Full wipe down", type: "Cleaning", repeatEveryWeeks: 2 },
                { id: "C-102", title: "Laundry", description: "Whites + colors", type: "Laundry", repeatEveryWeeks: 1 },
                { id: "C-103", title: "Garden check", description: "Water + trim", type: "Garden", repeatEveryWeeks: 3 }
            ];
        }

        function numberOrNull(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
        }

        function generateChoreId() {
            return `C-${Math.floor(100 + Math.random() * 900)}`;
        }

        function normalizeNewChore(responseChore, payload) {
            return {
                id: responseChore.id ?? generateChoreId(),
                title: responseChore.title ?? payload.title,
                description: responseChore.description ?? payload.description,
                type: responseChore.type ?? payload.type,
                repeatEveryWeeks: responseChore.repeatEveryWeeks ?? payload.repeatEveryWeeks,
                important: Boolean(responseChore.important)
            };
        }
    </script>
</body>

</html>
